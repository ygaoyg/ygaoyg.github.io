# ===========================================================================
# Lab News — single source of truth.
# Both the News page (/news/) and the homepage "Lab News" sidebar read from
# this file. Add or edit an entry here and BOTH update automatically.
#
# Entries can be in any order; the site sorts by `date` (newest first).
#
# Fields per entry:
#   date         : YYYY-MM-DD   (used only for sorting — required)
#   date_display : how the date appears on the site (e.g. "March 2026")
#   text         : the news text (HTML links allowed, e.g. <a href='...'>...</a>)
#   photo        : OPTIONAL image in /pics/ (shown on the News page only).
#                  Omit for a text-only entry.
#   logo         : OPTIONAL true — render `photo` as a contained logo
#                  (white box, no cropping) instead of a cover photo.
# ===========================================================================

- date: 2026-08-15
  date_display: "August 2026"
  text: "Our lab received a &ldquo;D-Feet Cancer: The Dalton Fox Foundation&rdquo; St. Baldrick's Research Grant ($200,000 over two years) to find better targeted therapies for Ewing sarcoma."

- date: 2026-08-04
  date_display: "August 2026"
  text: "In March 2025, a group of experts spanning sarcoma biologists, chemical biologists, pediatric oncologists, pharmaceutical company representatives, and patient advocates met for three days at the Banbury Center of Cold Spring Harbor Laboratory to discuss the challenges of therapeutic target development for pediatric sarcomas. Dr. Gao co-led the resulting perspective (with Dr. Lillian Guenther at St. Jude), now published in Genes &amp; Development. <a href='https://doi.org/10.1101/gad.353549.125' target='_blank'>Read &ldquo;Pediatric sarcomas: challenges and opportunities&rdquo; &#8599;</a>"
  photo: gad_pediatric_sarcoma.png
  doc: true

- date: 2026-07-31
  date_display: "July 2026"
  text: "Hypothesis confirmed! 🏆 Dr. Gao won the lab's FIFA World Cup 2026 prediction pool by calling Spain, and the lab crowned her with a custom trophy."
  photo: fifa-2026-slide.png
  slide: true

